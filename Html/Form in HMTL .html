          <!-- 1 : Action in Form 
          it used to define what action needs to be performed when a form is submitted 
          <form action="/action.php"> -->
        
                <!-- Text and Password 
        <input type="text" placeholder="Enter your name">
        <input type="password" placeholder="Enter your password"> -->

        <form action="/action.php">

            <input type="text" placeholder="Enter your Name"><br>
            <input type="password" placeholder="Enter your password"><br>

               <!-- Label help when we click on text then also its will show tick   
               For tick process we use format 
               <input type="radio" value="name of opton" name="format name">name of option
               FOR BOTH WE USE 
               <label for="any no">
                <input type="radio" value="name of opton" name="format name" id="any no">

               <label for="23">

                        <!-- class and id

                        checkbox for multiple opton selection

                <br>
