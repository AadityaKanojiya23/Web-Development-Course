<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with tailwind</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-gradient-to-r from-gray-500 via-gray-400 to-gray-300 flex justify-center items-center min-h-screen">
    <div class="bg-purple-400 p-10 rounded-lg shadow-2xl shadow-lg max-w-sm w-full">
        <h2 class="text-center wb-2 text-3xl text-black mb-3 font-bold">
            Login 
        </h2>
        <form>
            <div class="mb-4">
                <label class="block text-sm font-medium text-black wb-2" for="">Email : </label>
                <input class="bg-gray-800 w-full px-3 py-2 text-white rounded-lg focus:outline-none" type="Eamil" name="" placeholder="Email" required  id="">
            </div>
            <div class="mb-4">
                 <label class="block text-sm font-medium text-black" for="">Password : </label>
                <input class="bg-gray-800 w-full px-3 py-2 text-white rounded-lg focus:outline-none" type="password" name="" placeholder="Password" required id="">
            </div>
            <button type="submit" class="bg-purple-200 wb-2 py-1 px-6 w-full rounded-2xl font-medium   hover:bg-purple-300">Login</button>
        </form>
    </div>
</body>
</html>
